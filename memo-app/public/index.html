<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リサーチメモ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <h1>リサーチメモ</h1>
      <button id="logout-btn" class="secondary">ログアウト</button>
    </div>
  </header>

  <main>
    <div id="page-memo" class="page">
      <section class="card">
        <div class="list-header">
          <h2>メモ一覧</h2>
          <div class="filters" id="status-filters"></div>
        </div>
        <ul id="memo-list" class="memo-list"></ul>
        <p id="empty-state" class="empty" hidden>まだメモがありません。右下の + から追加してください。</p>
      </section>
    </div>

    <div id="page-research" class="page" hidden>
      <section class="card">
        <h2>リサーチ結果</h2>
        <div class="research-grid" id="research-grid"></div>
        <p id="research-empty" class="empty" hidden>まだ生成物がありません。メモが処理されるとここに表示されます。</p>
      </section>
    </div>

    <div id="page-output" class="page output-page" hidden>
      <div class="output-page-header">
        <button type="button" id="output-back-btn" class="secondary" aria-label="戻る">← 戻る</button>
        <h2 id="output-page-title"></h2>
      </div>
      <div class="output-tabs" id="output-tabs"></div>
      <div class="output-history" id="output-history" hidden></div>
      <div id="output-page-content" class="output-content"></div>
    </div>
  </main>

  <button type="button" id="add-memo-fab" class="fab" aria-label="新しいメモを追加">+</button>

  <div id="add-memo-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3>新しいメモを追加</h3>
        <button type="button" id="add-memo-close" class="secondary">閉じる</button>
      </div>
      <form id="memo-form">
        <label>
          タイトル <span class="required">必須</span>
          <input type="text" id="title" name="title" placeholder="例: 生成AIの著作権問題まとめ" required>
        </label>
        <label>
          リサーチしてほしい内容
          <textarea id="brief" name="brief" rows="6" placeholder="何を、どんな角度で調べて記事にしてほしいか書く（画像やURLを添付する場合は空欄でも可）"></textarea>
        </label>
        <label>
          参照URL（Instagram・X・YouTubeなど）
          <input type="url" id="source-url" placeholder="https://...">
        </label>
        <div class="field-block">
          <span class="field-label">スクリーンショットを添付</span>
          <input type="file" id="screenshot-input" accept="image/*">
          <img id="screenshot-preview" class="screenshot-preview" hidden>
          <button type="button" id="screenshot-clear-btn" class="secondary" hidden>画像を削除</button>
        </div>
        <div class="field-block">
          <span class="field-label">優先度</span>
          <div class="priority-picker" id="priority-picker"></div>
        </div>
        <div class="field-block">
          <span class="field-label">カテゴリ</span>
          <div class="category-picker" id="category-picker"></div>
          <button type="button" id="add-category-btn" class="secondary">+ カテゴリ追加</button>
        </div>
        <div class="field-block">
          <span class="field-label">生成する項目</span>
          <div class="category-picker" id="output-type-picker"></div>
        </div>
        <div class="field-block">
          <span class="field-label">リサーチ方法</span>
          <div class="category-picker" id="research-mode-picker"></div>
        </div>
        <div class="field-block" id="recurring-frequency-block" hidden>
          <span class="field-label">頻度</span>
          <div class="category-picker" id="recurring-frequency-picker"></div>
        </div>
        <p id="form-error" class="error" hidden></p>
        <button type="submit">メモを追加</button>
      </form>
    </div>
  </div>

  <div id="memo-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="memo-modal-title"></h3>
        <button type="button" id="memo-modal-close" class="secondary">閉じる</button>
      </div>

      <div id="memo-view">
        <div class="memo-meta" id="memo-view-badges"></div>
        <p id="memo-view-brief" class="memo-brief"></p>
        <a id="memo-view-source-url" class="source-url-link" target="_blank" rel="noopener noreferrer" hidden></a>
        <img id="memo-view-screenshot" class="memo-view-screenshot" hidden>
        <div class="memo-outputs" id="memo-view-outputs"></div>
        <div class="field-block">
          <span class="field-label">ステータス</span>
          <select id="memo-view-status"></select>
        </div>
        <div class="memo-actions">
          <button type="button" id="memo-edit-btn" class="secondary">編集</button>
          <button type="button" id="memo-delete-btn" class="danger">削除</button>
        </div>
      </div>

      <form id="memo-edit-form" hidden>
        <label>
          タイトル <span class="required">必須</span>
          <input type="text" id="edit-title" required>
        </label>
        <label>
          リサーチしてほしい内容
          <textarea id="edit-brief" rows="6"></textarea>
        </label>
        <label>
          参照URL（Instagram・X・YouTubeなど）
          <input type="url" id="edit-source-url" placeholder="https://...">
        </label>
        <div class="field-block">
          <span class="field-label">スクリーンショットを添付</span>
          <input type="file" id="edit-screenshot-input" accept="image/*">
          <img id="edit-screenshot-preview" class="screenshot-preview" hidden>
          <button type="button" id="edit-screenshot-clear-btn" class="secondary" hidden>画像を削除</button>
        </div>
        <div class="field-block">
          <span class="field-label">優先度</span>
          <div class="priority-picker" id="edit-priority-picker"></div>
        </div>
        <div class="field-block">
          <span class="field-label">カテゴリ</span>
          <div class="category-picker" id="edit-category-picker"></div>
        </div>
        <div class="field-block">
          <span class="field-label">生成する項目</span>
          <div class="category-picker" id="edit-output-type-picker"></div>
        </div>
        <div class="field-block">
          <span class="field-label">リサーチ方法</span>
          <div class="category-picker" id="edit-research-mode-picker"></div>
        </div>
        <div class="field-block" id="edit-recurring-frequency-block" hidden>
          <span class="field-label">頻度</span>
          <div class="category-picker" id="edit-recurring-frequency-picker"></div>
        </div>
        <p id="edit-error" class="error" hidden></p>
        <div class="memo-actions">
          <button type="submit">保存</button>
          <button type="button" id="memo-edit-cancel" class="secondary">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="bottom-nav" id="page-tabs">
    <button type="button" class="bottom-nav-btn active" data-page="memo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
      <span>メモ</span>
    </button>
    <button type="button" class="bottom-nav-btn" data-page="research">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>リサーチ</span>
    </button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
