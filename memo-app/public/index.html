<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リサーチメモ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>リサーチメモ</h1>
        <p class="subtitle">リサーチしてほしいトピックを書き留めておくと、Claude Code が定期的に読み取って記事下書き・ショート動画構成まで作ります。</p>
      </div>
      <button id="logout-btn" class="secondary">ログアウト</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>新しいメモを追加</h2>
      <form id="memo-form">
        <label>
          タイトル <span class="required">必須</span>
          <input type="text" id="title" name="title" placeholder="例: 生成AIの著作権問題まとめ" required>
        </label>
        <label>
          リサーチしてほしい内容 <span class="required">必須</span>
          <textarea id="brief" name="brief" rows="4" placeholder="何を、どんな角度で調べて記事にしてほしいか書く"></textarea>
        </label>
        <div class="row">
          <label>
            優先度
            <select id="priority" name="priority">
              <option value="normal" selected>普通</option>
              <option value="high">高い</option>
              <option value="low">低い</option>
            </select>
          </label>
          <label>
            タグ（カンマ区切り）
            <input type="text" id="tags" name="tags" placeholder="AI, マーケティング">
          </label>
        </div>
        <label>
          補足メモ（任意）
          <textarea id="notes" name="notes" rows="2" placeholder="トーン、参考にしたい記事、避けたい論点など"></textarea>
        </label>
        <button type="submit">メモを追加</button>
      </form>
      <p id="form-error" class="error" hidden></p>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>メモ一覧</h2>
        <div class="filters" id="status-filters"></div>
      </div>
      <ul id="memo-list" class="memo-list"></ul>
      <p id="empty-state" class="empty" hidden>まだメモがありません。上のフォームから追加してください。</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
