<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リサーチメモ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <h1>リサーチメモ</h1>
      <button id="logout-btn" class="secondary">ログアウト</button>
    </div>
  </header>

  <main>
    <div id="page-memo" class="page">
      <section class="card">
        <h2>新しいメモを追加</h2>
        <form id="memo-form">
          <label>
            タイトル <span class="required">必須</span>
            <input type="text" id="title" name="title" placeholder="例: 生成AIの著作権問題まとめ" required>
          </label>
          <label>
            リサーチしてほしい内容 <span class="required">必須</span>
            <textarea id="brief" name="brief" rows="8" placeholder="何を、どんな角度で調べて記事にしてほしいか書く"></textarea>
          </label>
          <div class="field-block">
            <span class="field-label">優先度</span>
            <div class="priority-picker" id="priority-picker"></div>
          </div>
          <div class="field-block">
            <span class="field-label">カテゴリ</span>
            <div class="category-picker" id="category-picker"></div>
            <button type="button" id="add-category-btn" class="secondary">+ カテゴリ追加</button>
          </div>
          <button type="submit">メモを追加</button>
        </form>
        <p id="form-error" class="error" hidden></p>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>メモ一覧</h2>
          <div class="filters" id="status-filters"></div>
        </div>
        <ul id="memo-list" class="memo-list"></ul>
        <p id="empty-state" class="empty" hidden>まだメモがありません。上のフォームから追加してください。</p>
      </section>
    </div>

    <div id="page-research" class="page" hidden>
      <section class="card">
        <h2>リサーチ結果</h2>
        <div class="research-grid" id="research-grid"></div>
        <p id="research-empty" class="empty" hidden>まだ生成物がありません。メモが処理されるとここに表示されます。</p>
      </section>
    </div>
  </main>

  <div id="output-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="secondary">閉じる</button>
      </div>
      <pre id="modal-body" class="modal-body"></pre>
    </div>
  </div>

  <nav class="bottom-nav" id="page-tabs">
    <button type="button" class="bottom-nav-btn active" data-page="memo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
      <span>メモ</span>
    </button>
    <button type="button" class="bottom-nav-btn" data-page="research">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>リサーチ</span>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
